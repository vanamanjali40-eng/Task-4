<style>

header{background:#17365d;color:white;padding:22px 28px}

main{padding:20px;max-width:1200px;margin:auto}
.filters,.kpis,.charts{display:grid;gap:14px}

.charts{grid-template-columns:1.5fr 1fr}.chart{height:350px}
footer{color:#66758b;font-size:12px;text-align:center;padding:20px}
@media(max-width:750px){.kpis{grid-template-columns:repeat(2,1fr)}.charts,.filters{grid-template-columns:1fr}.chart{height:300px}}
</style></head><body>
<header><h1>Sales & Financial Performance Dashboard</h1><p>Business overview • Sample dataset • January–December 2025</p></header>

</div>
<div class="charts"><div class="card"><div id="trend" class="chart"></div></div><div class="card"><div id="categoryChart" class="chart"></div></div></div>
<div class="charts" style="margin-top:14px"><div class="card"><div id="regionChart" class="chart"></div></div><div class="card"><div id="profitChart" class="chart"></div></div></div>
</main><footer>Created for Task 4: Dashboard Design | Synthetic practice data, not actual company financials</footer>

const money = n => "₹" + Math.round(n).toLocaleString("en-IN");
const months = [...new Set(data.map(x=>x.Month))].sort();
const ms = document.getElementById("month");
months.forEach(m=>{let o=document.createElement("option");o.value=m;o.textContent=m;ms.appendChild(o)});
["region","category","month"].forEach(id=>document.getElementById(id).addEventListener("change",render));
function render(){
 const r=document.getElementById("region").value,c=document.getElementById("category").value,m=document.getElementById("month").value;
 const f=data.filter(x=>(r==="All"||x.Region===r)&&(c==="All"||x.Category===c)&&(m==="All"||x.Month===m));
 const s=f.reduce((a,x)=>a+x.Sales,0),p=f.reduce((a,x)=>a+x.Profit,0),u=f.reduce((a,x)=>a+x.Units_Sold,0);
 document.getElementById("sales").textContent=money(s);
 document.getElementById("profit").textContent=money(p);
 document.getElementById("margin").textContent=(s?p/s*100:0).toFixed(1)+"%";
 document.getElementById("orders").textContent=f.length.toLocaleString("en-IN");
 const group=(key)=>{const z={};f.forEach(x=>{z[x[key]]??={Sales:0,Profit:0};z[x[key]].Sales+=x.Sales;z[x[key]].Profit+=x.Profit});return z};
 const byMonth=group("Month"), labels=Object.keys(byMonth).sort();
 Plotly.react("trend",[{x:labels,y:labels.map(k=>byMonth[k].Sales),name:"Sales",type:"scatter",mode:"lines+markers"},{x:labels,y:labels.map(k=>byMonth[k].Profit),name:"Profit",type:"scatter",mode:"lines+markers"}],{title:"Monthly Sales & Profit",margin:{t:45,l:55,r:15,b:45},legend:{orientation:"h"},paper_bgcolor:"white",plot_bgcolor:"white"});
 const bc=group("Category"), cl=Object.keys(bc);
 Plotly.react("categoryChart",[{labels:cl,values:cl.map(k=>bc[k].Sales),type:"pie",hole:.45}],{title:"Sales by Category",margin:{t:45,l:10,r:10,b:10},showlegend:true});
 const br=group("Region"), rl=Object.keys(br);
 Plotly.react("regionChart",[{x:rl,y:rl.map(k=>br[k].Sales),type:"bar",name:"Sales"}],{title:"Sales by Region",margin:{t:45,l:55,r:15,b:45},paper_bgcolor:"white",plot_bgcolor:"white"});
 Plotly.react("profitChart",[{x:cl,y:cl.map(k=>bc[k].Profit),type:"bar",name:"Profit"}],{title:"Profit by Category",margin:{t:45,l:55,r:15,b:45},paper_bgcolor:"white",plot_bgcolor:"white"});
